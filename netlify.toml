[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Keep this marker with the story tail-editor release so Netlify receives a
# conventional config-file change and performs a fresh production build.
# story-tail-editor-modal: 2026-09-11

# Fonts/models/images are static assets with no fingerprint, and large (CJK
# fonts 7-24MB, 3D models 10MB+). Set to one-year immutable so a repeat visit
# costs zero bandwidth once cached. When updating these files, rename them
# (add a version suffix) or old clients will keep serving the cached copy.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Other stable static assets: HDR environment lighting, map boundary data,
# sound effects, and the widget/theme/decoration image directories. These load
# via fetch()/Audio()/Environment, which bypasses the service worker's
# per-type cache, so they need this HTTP-header fallback instead. Same rule:
# rename the file when updating its content.
[[headers]]
  for = "/hdri/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/countries.geo.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/widgets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/birds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/diary/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/game-covers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/game-builtins/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/xiaohongshu/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Loose root-level images (mascot Scroll, default wallpaper) — same rule, rename to update.
[[headers]]
  for = "/mascot.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/default-wallpaper.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
